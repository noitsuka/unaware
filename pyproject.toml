[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unaware"
version = "1.0.0"
description = "Autonomous Pokémon Showdown player for Gen 9 singles, built on Foul Play"
requires-python = ">=3.12,<3.13"
dependencies = ["poke-env==0.16.1", "pywebview==6.2.1", "psutil==7.2.2", "aiohttp==3.14.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
unaware = "unaware.__main__:main"

[tool.setuptools.packages.find]
include = ["unaware*"]

[tool.setuptools.package-data]
unaware = ["simulator_worker.js", "simulator_pool.js", "neural/weights.pt", "neural/material_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
